name: Bootstrap lockfile

on:
  push:
    branches:
      - agent/pr-01-foundation

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve dependency lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
