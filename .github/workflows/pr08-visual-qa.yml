name: PR08 release visual QA

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Start production app
        run: |
          pnpm start > /tmp/german-language.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/a1 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/german-language.log
          exit 1
      - name: Capture release surfaces
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch();
            const cases = [
              ['map-desktop', '/a1', { width: 1440, height: 1000 }, false],
              ['lesson-desktop', '/a1/accusative-articles', { width: 1440, height: 1000 }, false],
              ['map-mobile', '/a1', { width: 390, height: 844 }, true],
              ['lesson-mobile', '/a1/accusative-articles', { width: 390, height: 844 }, true],
            ];
            for (const [name, path, viewport, isMobile] of cases) {
              const page = await browser.newPage({ viewport, isMobile, hasTouch: isMobile });
              await page.goto(`http://127.0.0.1:3000${path}`, { waitUntil: 'networkidle' });
              await page.screenshot({ path: `visual-qa/${name}.png`, fullPage: true });
              await page.close();
            }
            await browser.close();
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr08-release-visual-qa
          path: visual-qa/*.png
          retention-days: 1
