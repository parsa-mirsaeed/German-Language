name: PR02 visual QA capture

on:
  push:
    branches:
      - agent/pr-02-canonical-lesson

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build

      - name: Start production app
        run: |
          pnpm start > /tmp/german-language.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/a1/accusative-articles > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/german-language.log
          exit 1

      - name: Capture production render
        env:
          PREVIEW_URL: http://127.0.0.1:3000/a1/accusative-articles
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch();
            const url = process.env.PREVIEW_URL;

            const desktop = await browser.newPage({
              viewport: { width: 1440, height: 1000 },
            });
            await desktop.goto(url, { waitUntil: 'networkidle' });
            await desktop.screenshot({
              path: 'visual-qa/canonical-desktop.png',
              fullPage: true,
            });
            await desktop.close();

            const mobile = await browser.newPage({
              viewport: { width: 390, height: 844 },
              isMobile: true,
              hasTouch: true,
            });
            await mobile.goto(url, { waitUntil: 'networkidle' });
            await mobile.screenshot({
              path: 'visual-qa/canonical-mobile.png',
              fullPage: true,
            });
            await mobile.close();

            await browser.close();
          })();
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: pr02-production-visual-qa
          path: visual-qa/*.png
          retention-days: 1
